<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<main id="app">
  <header class="topbar">
    <h1>Calorie Tracker</h1>
    <button id="menu-toggle" type="button" aria-label="Open menu"
            aria-expanded="false" aria-controls="drawer">
      <img src="/logo.svg" alt="" />
    </button>
  </header>

  <section class="totals">
    <div><span id="total-kcal">0</span><small>kcal today</small></div>
    <div><span id="total-protein">0</span><small>g protein today</small></div>
  </section>

  <ul id="entries"></ul>

  <div class="dock">
    <section class="add calories nad protein">
      <div class="picker">
        <label for="kcal">Calories</label>
        <output id="kcal-value">550</output>
        <input id="kcal" type="range" min="0" max="2000" step="50" value="550" />
      </div>
      <div class="picker">
        <label for="protein">Protein (g)</label>
        <output id="protein-value">20</output>
        <input id="protein" type="range" min="0" max="200" step="5" value="20" />
      </div>
      <button id="add-btn" type="button">Add</button>
    </section>
  </div>
</main>

<div id="backdrop" class="backdrop"></div>
<nav id="drawer" class="drawer" aria-label="Menu" inert>
  <button id="export-btn" type="button">Export data</button>
  <button id="import-btn" type="button">Import data</button>
  <input id="import-file" type="file" accept="application/json,.json" hidden />
</nav>

<script type="module" src="/src/main.js"></script>
</body>
</html>
